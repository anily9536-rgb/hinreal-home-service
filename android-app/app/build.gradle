
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.realhomeservice.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.realhomeservice.customer'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions += 'edition'

    productFlavors {
        customer {
            dimension 'edition'
            applicationId 'com.realhomeservice.customer'
            resValue 'string', 'app_name', 'Real Home Service'
            manifestPlaceholders = [
                appIcon: '@drawable/customer_app_logo'
            ]
            buildConfigField 'String', 'START_URL', '"https://real-home-service.vercel.app/"'
        }

        admin {
            dimension 'edition'
            applicationId 'com.realhomeservice.admin'
            resValue 'string', 'app_name', 'Real Home Service Admin'
            manifestPlaceholders = [
                appIcon: '@drawable/admin_app_logo'
            ]
            buildConfigField 'String', 'START_URL', '"https://real-home-service.vercel.app/admin/login"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def generatedLogoResDir = layout.buildDirectory.dir("generated/res/logo")

android.sourceSets.main.res.srcDir(generatedLogoResDir)

tasks.register("downloadAppLogos") {
    outputs.files(
        generatedLogoResDir.map {
            it.file("drawable-nodpi/customer_app_logo.png")
        },
        generatedLogoResDir.map {
            it.file("drawable-nodpi/admin_app_logo.png")
        }
    )

    doLast {
        def logoDir = generatedLogoResDir.get()
            .dir("drawable-nodpi").asFile

        logoDir.mkdirs()

        def logos = [
            "customer_app_logo.png":
                "https://raw.githubusercontent.com/anily9536-rgb/hinreal-home-service/main/public/customer-logo.png",

            "admin_app_logo.png":
                "https://raw.githubusercontent.com/anily9536-rgb/hinreal-home-service/main/public/admin-logo.png"
        ]

        logos.each { fileName, imageUrl ->
            def logoFile = new File(logoDir, fileName)

            new URL(imageUrl).withInputStream { input ->
                logoFile.withOutputStream { output ->
                    output << input
                }
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("downloadAppLogos")
}
