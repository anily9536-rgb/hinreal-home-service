plugins {
    id 'com.android.application'
}

android {
    namespace 'com.realhomeservice.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.realhomeservice.customer'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    flavorDimensions += 'edition'

    productFlavors {
        customer {
            dimension 'edition'
            applicationId 'com.realhomeservice.customer'
            resValue 'string', 'app_name', 'Real Home Service'
            buildConfigField 'String', 'START_URL', '"https://real-home-service.vercel.app/"'
        }

        admin {
            dimension 'edition'
            applicationId 'com.realhomeservice.admin'
            resValue 'string', 'app_name', 'Real Home Service Admin'
            buildConfigField 'String', 'START_URL', '"https://real-home-service.vercel.app/admin/login"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
def generatedLogoResDir = layout.buildDirectory.dir("generated/res/logo")

android.sourceSets.main.res.srcDir(generatedLogoResDir)

tasks.register("downloadAppLogo") {
    outputs.file(generatedLogoResDir.map { it.file("drawable/app_logo.png") })

    doLast {
        def logoFile = generatedLogoResDir.get().file("drawable/app_logo.png").asFile
        logoFile.parentFile.mkdirs()

        new URL("https://raw.githubusercontent.com/anily9536-rgb/hinreal-home-service/main/public/file_0000000045d0821180988036e39a5ebd.png").withInputStream { input ->
            logoFile.withOutputStream { output -> output << input }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("downloadAppLogo")
}
