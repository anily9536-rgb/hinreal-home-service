name: Build Customer and Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build both APKs
        run: |
          gradle -p android-app assembleCustomerRelease assembleAdminRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Real-Home-Service-APKs
          path: |
            android-app/app/build/outputs/apk/customer/release/*.apk
            android-app/app/build/outputs/apk/admin/release/*.apk
